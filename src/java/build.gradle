plugins {
    id 'java'
    id 'application'
    id 'io.micronaut.application' version '4.3.5'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'jacoco'
}

version = '0.1.0'
group = 'com.lineagelens'

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor("io.micronaut:micronaut-inject-java")
    annotationProcessor("info.picocli:picocli-codegen")

    implementation("io.micronaut:micronaut-inject")
    implementation("io.micronaut.picocli:micronaut-picocli")
    implementation("info.picocli:picocli")

    // Eclipse JDT AST Parser
    implementation("org.eclipse.jdt:org.eclipse.jdt.core:3.38.0")

    // JSON serialization
    implementation("com.fasterxml.jackson.core:jackson-databind:2.17.0")

    runtimeOnly("ch.qos.logback:logback-classic:1.5.3")

    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

application {
    mainClass = "com.lineagelens.Application"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

micronaut {
    version("4.3.5")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("com.lineagelens.*")
    }
}

shadowJar {
    archiveBaseName.set('lineagelens-java')
    archiveClassifier.set('')
    archiveVersion.set('')
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'CLASS'
            excludes = ['com.lineagelens.Application']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}
check.dependsOn jacocoTestCoverageVerification
