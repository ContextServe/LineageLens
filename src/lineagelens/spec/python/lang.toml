lang = "python"
dialects = ["python"]

# `self` and `cls` are declared parameters but play no part in overload
# identity, so they are dropped before the signature is hashed (§6). Python has
# no overloading, but the same rule keeps a method's signature hash stable if it
# is later moved between a class and module scope.
implicit_receivers = ["self", "cls"]

doc_prefixes = ["#"]

constructor_names = ["__init__", "__new__"]
