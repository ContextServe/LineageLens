repo:
  url: https://github.com/langchain-ai/langchain
  pr: 39809
  base_commit: ""          # optional — default: PR's base SHA (via gh pr view)
  expected_commit: ""      # optional — default: PR's merge SHA; used for validation

language: python           # python | java | js  (authoritative — the developer sets it)

work_dir: /tmp/ll-bench    # where the 2 clones + results are created
mcp_dir: mcptest
nonmcp_dir: nonmcp_test

source_roots: []           # optional; for non-src/-layout repos (e.g., langchain's
                           # libs/langchain/langchain/...) — written into mcptest's
                           # lineagelens.yaml before analyze, avoids a silent empty graph
                           # Example: ["libs/langchain/langchain"]

model: claude-sonnet-4-5
budget_usd: 3.00           # -> --max-budget-usd on both claude calls
timeout_seconds: 900

mcp_tool_prefix: mcp__lineagelens   # set once after the one-time spike
