repo:
  url: https://github.com/langchain-ai/langchain
  pr: 39809
  base_commit: ""          # optional — default: PR's base SHA (via gh pr view)
  expected_commit: ""      # optional — default: PR's merge SHA; used for validation

language: python           # python | java | js  (authoritative — the developer sets it)

# Which arms (code-graph tools) to benchmark
arms: [lineagelens, codegraph, graphify, baseline]

work_dir: /tmp/ll-bench    # where the clones + results are created

# Generalized clone directory mapping (optional; defaults to clone_{arm_name})
clone_dirs:
  lineagelens: mcptest
  codegraph: cgtest
  graphify: gftest
  baseline: nonmcp_test

source_roots: []           # optional; for non-src/-layout repos (e.g., langchain's
                           # libs/langchain/langchain/...) — written into lineagelens.yaml
                           # before analyze, avoids a silent empty graph
                           # Example: ["libs/langchain/langchain"]

model: claude-sonnet-4-5
budget_usd: 3.00           # -> --max-budget-usd on all claude calls
timeout_seconds: 900

mcp_tool_prefix: mcp__lineagelens
