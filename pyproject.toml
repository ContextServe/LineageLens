[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lineagelens"
version = "0.1.0"
description = "Evidence-labelled Python code lineage for humans and coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "LineageLens contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "strawberry-graphql[fastapi]>=0.235", "uvicorn>=0.29", "pydantic>=2.0"]
mcp = ["mcp>=1.0"]
llm = ["httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.5", "vitest>=1.0"]

[project.scripts]
lineagelens = "lineagelens.cli:main"
lineagelens-mcp = "lineagelens.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lineagelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

