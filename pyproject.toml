[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lineagelens"
version = "0.1.0"
description = "Evidence-labelled Python code lineage for humans and coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "LineageLens contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0",
  "jedi>=0.19",
  "fastapi>=0.110",
  "strawberry-graphql[fastapi]>=0.235",
  "uvicorn>=0.29",
  "pydantic>=2.0",
  "watchdog>=3.0.0",
  "tomli>=2.0; python_version<'3.11'",

  # Tier A extraction is not optional (issue #51 §7.1), so tree-sitter and every
  # grammar is a hard dependency rather than an extra. Previously `tree-sitter`
  # sat behind an extra and *no grammar package was declared at all*, so
  # `_get_tree_sitter_parser` returned None for all 12 advertised languages and
  # every non-Python file silently fell through to a regex line scanner. On
  # Apache Dubbo that produced 4,297 "classes" matched from `"class " in line`
  # and five "methods" that were string literals from a switch statement.
  #
  # Versions are pinned exactly, not floored. A grammar upgrade changes parse
  # output, which must invalidate the index rather than silently alter results;
  # the pinned set's digest is recorded in graph_meta.grammar_digest (§11).
  # A `>=` floor here would make `--verify-determinism` unenforceable.
  "tree-sitter==0.26.0",
  "tree-sitter-python==0.25.0",
  "tree-sitter-java==0.23.5",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-go==0.25.0",
  "tree-sitter-rust==0.24.2",
  "tree-sitter-c-sharp==0.23.5",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "strawberry-graphql[fastapi]>=0.235", "uvicorn>=0.29", "pydantic>=2.0"]
mcp = ["mcp>=1.0"]
llm = ["httpx>=0.27"]
# SCIP is a Tier B resolver oracle (§7.2), not a graph producer, so it stays
# optional. The `treesitter` and `hybrid` extras are gone: tree-sitter is now a
# core dependency and there is no longer a user-selectable engine to combine.
scip = ["protobuf>=4.25.0"]

# ruff is pinned to a minor range, not just a floor. Its default rule set
# widened between releases, which turned CI lint into a moving target that
# failed on code nobody had touched. [tool.ruff.lint] now selects rules
# explicitly, and this bound stops a new release adding more unannounced.
dev = ["pytest>=8.0", "ruff>=0.16,<0.17"]

[project.scripts]
lineagelens = "lineagelens.cli:main"
lineagelens-mcp = "lineagelens.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lineagelens"]

# Include pre-built frontend in the wheel
# Frontend must be built before packaging: cd frontend && npm install && npm run build
# Then commit frontend/dist to git before running python -m build .
[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "lineagelens/frontend/dist"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff]
# The reachability corpus is fixture *data*: it is deliberately written to look
# like real-world code (forward-ref annotations, Optional, a shadowed builtin
# name) so the analyzer sees realistic input. Linting it would mean rewriting
# fixtures to satisfy a linter rather than to exercise the analyzer.
extend-exclude = ["tests/fixtures"]
target-version = "py310"

[tool.ruff.lint]
# Selected explicitly rather than relying on ruff's defaults. Those defaults
# widened between releases, and with only a `ruff>=0.5` floor that silently
# turned CI lint into a moving target. Pin the intent here instead.
select = [
  "E4", "E7", "E9",  # pycodestyle: real errors, not formatting opinions
  "F",               # pyflakes
  "I",               # import sorting
  "UP",              # pyupgrade (this project targets 3.10+)
  "B",               # bugbear: likely bugs
  "SIM",             # simplifiable constructs
  "C4",              # comprehension misuse
  "FLY",             # static string joins
  "PIE",             # misc lints
  "RUF",             # ruff's own
  "BLE",             # blind excepts (see the ignore below)
  "S",               # bandit-style security checks
  "DTZ",             # naive datetimes
]

ignore = [
  # The analyzer's documented contract is that it never aborts on a bad input
  # file: a syntax error, an encoding problem or an unexpected AST shape must be
  # recorded in the report and analysis must continue on the next file. That is
  # implemented with broad excepts on purpose, and each one records a
  # FileFailure or a SymbolWarning rather than swallowing the error silently.
  "BLE001",
  # Same reasoning where the recovery genuinely is "carry on": probing an
  # optional third-party API surface that varies by version.
  "S110",
  # This project shells out to `git` to resolve the hooks directory, which is the
  # only correct way to support worktrees and core.hooksPath. Resolving it from
  # PATH is intended -- hardcoding /usr/bin/git would break on any machine that
  # installs git elsewhere. The argument vector is a literal list, never a shell
  # string, so there is no injection surface.
  "S603", "S607",
  # Informational glyphs (e.g. U+2139) in human-facing CLI output. The homoglyph
  # concern applies to identifiers and compared strings, not to display text.
  "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on hard-coded fixture values and build throwaway projects in
# tmp_path; neither is a security finding.
"tests/*" = ["S101", "S108"]
