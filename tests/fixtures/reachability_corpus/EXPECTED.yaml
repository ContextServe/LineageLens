# --- package __all__ re-export ---------------------------------------------
corpus.exported.exported_only:
  # Nothing calls this. The package __all__ is its only reference.
  verdict: alive
  rescue: dunder_all_export
  scope: source

# --- inheritance and polymorphic dispatch ----------------------------------
corpus.inheritance.Base:
  verdict: alive
  rescue: type_annotation
  scope: source
corpus.inheritance.Base.op:
  # Called through the annotated base parameter in consume().
  verdict: alive
  rescue: annotated_parameter
  scope: source
corpus.inheritance.ChildA:
  verdict: alive
  rescue: static_call
  scope: source
corpus.inheritance.ChildA.op:
  # No call site names it. Reached because it overrides a reachable base method,
  # which is a name-match heuristic, hence dynamic_only rather than alive.
  verdict: dynamic_only
  rescue: polymorphic_override
  scope: source
corpus.inheritance.ChildB:
  verdict: alive
  rescue: static_call
  scope: source
corpus.inheritance.ChildB.op:
  verdict: dynamic_only
  rescue: polymorphic_override
  scope: source

# --- __main__ guard --------------------------------------------------------
corpus.mainguard.run_it:
  # Called at module scope inside `if __name__ == "__main__":`.
  verdict: alive
  rescue: static_call
  scope: source

