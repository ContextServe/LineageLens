# --- polymorphic consumer --------------------------------------------------
corpus.polymorphic.consume:
  verdict: alive
  rescue: static_call
  scope: source
corpus.polymorphic.make:
  # CONTROL: nothing calls make(), so it is dead -- and critically, the
  # references it *makes* (to consume and ChildA) must not rescue anything on
  # its behalf. A dead function's outgoing edges are not reachability.
  verdict: dead
  rescue: null
  scope: source

# --- functions referenced as values at module scope ------------------------
corpus.registry.handler_a:
  verdict: alive
