# Golden reachability table for the corpus.
#
# This file is the specification, not a snapshot: it records what each symbol
# *should* be once reachability is modelled, and phases flip entries into place.
# Two-way set equality against the analyzed graph is asserted, so a new symbol
# cannot slip in unclassified.
#
# Fields per symbol:
#   verdict  alive | dynamic_only | test_only | public_api | probably_dead | dead
#   rescue   the single mechanism that saved it (null when the verdict is dead)
#   scope    source | test  -- where the symbol lives, from is_test_path
#
# The "rescue" is the mechanism expected to *win*. Where several apply, the
# highest-trust one wins: a fact-tier static_call beats a heuristic-tier
# polymorphic_override. Fixtures are written so that the mechanism under test is
# the only one available, otherwise the test would pass for the wrong reason.

# --- annotations: classes referenced only from type annotations -------------
corpus.annotations.Later:
  # Reached only through the string forward-ref `-> "Later"`.
  verdict: alive
  rescue: type_annotation
  scope: source
corpus.annotations.Nested:
  # Reached only through a subscript annotation: Optional[list[Nested]].
  verdict: alive
  rescue: type_annotation
  scope: source
corpus.annotations.Payload:
  verdict: alive
  rescue: static_call
  scope: source
corpus.annotations.Result:
  verdict: alive
  rescue: static_call
  scope: source
corpus.annotations.returns_later:
  verdict: alive
  rescue: static_call
  scope: source
corpus.annotations.takes_nested:
  verdict: alive
  rescue: static_call
  scope: source
corpus.annotations.takes_payload:
  verdict: alive
  rescue: static_call
  scope: source

