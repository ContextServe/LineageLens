# --- celery-style task registration ---------------------------------------
corpus.tasks._App:
  verdict: alive
  rescue: static_call
  scope: source
corpus.tasks._App.task:
  verdict: alive
  rescue: decorator
  scope: source
corpus.tasks.do_work:
  # Registered by decorator; nothing in-repo calls it. The dotted string in
  # strings.py also names it, but REFERENCES_STRING is off by default, so the
  # task entry point must be what saves it.
  verdict: alive
  rescue: entry_point:task
  scope: source

# --- source code reachable only from tests --------------------------------
corpus.tested_only.only_tests_call_me:
  verdict: test_only
  rescue: static_call
  scope: source
corpus.tested_only.shared_by_test_and_main:
  verdict: alive
  rescue: static_call
  scope: source

# --- the pragma escape hatch ----------------------------------------------
corpus.pragma.kept_by_pragma:
  # `# lineagelens: keep` on the def line. No other reference exists.
  verdict: alive
  rescue: pragma_keep
  scope: source
corpus.pragma.kept_by_pragma_on_decorator:
  # CONTROL: identical shape without the pragma, so the pragma is proven to be
  # what does the work rather than something about the module.
  verdict: dead
  rescue: null
  scope: source
"corpus.pragma.<module>":
  verdict: alive
  rescue: module_scope
  scope: source

# --- the control group: genuinely dead ------------------------------------
corpus.truly_dead.never_used:
  verdict: dead
  rescue: null
  scope: source
corpus.truly_dead.NeverUsed:
  verdict: dead
  rescue: null
  scope: source
corpus.truly_dead.NeverUsed.also_never_used:
