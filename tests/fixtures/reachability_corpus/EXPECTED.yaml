  rescue: null
  scope: source

# --- script with module-scope wiring only ---------------------------------
scripts.run_batch.build:
  # Called at module scope. Relations used to require an enclosing function,
  # so this produced no edge of any kind.
  verdict: alive
  rescue: static_call
  scope: source
scripts.run_batch.wire:
  # Also module scope, but with an argument, so the argument mapping is
  # exercised from a non-function source too.
  verdict: alive
  rescue: static_call
  scope: source

# --- test-scope symbols ---------------------------------------------------
tests.conftest.db:
  verdict: alive
  rescue: entry_point:test_fixture
  scope: test
tests.helpers.helper:
  verdict: alive
  rescue: static_call
  scope: test
tests.helpers.unused_helper:
  # CONTROL: dead, but in a test file. Triage priority differs from source-scope
  # dead code, which is why scope is a separate field from verdict.
  verdict: dead
  rescue: null
  scope: test
tests.test_corpus.test_x:
  verdict: alive
  rescue: entry_point:test
  scope: test

# --- synthetic module-scope nodes ------------------------------------------
# One per module, owning statements that sit outside any function. Every one is
# a reachability root under the default `module_scope_roots: all`, which is an
# over-approximation: a module body only actually executes if something imports
# it. The stricter `imports_only` mode seeds only entry-point-bearing modules
# and propagates through IMPORTS edges. `all` is the default deliberately --
# over-approximating costs recall, but it never fabricates a "this is dead,
# delete it", and a 71% false-positive rate is the problem being fixed.
"corpus.<module>":
  verdict: alive
  rescue: module_scope
  scope: source
"corpus.annotations.<module>":
  verdict: alive
  rescue: module_scope
  scope: source
