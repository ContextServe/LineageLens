# Pre-commit configuration for LineageLens
# See https://pre-commit.com for more information

repos:
  - repo: local
    hooks:
      - id: backend-tests
        name: Backend Tests (pytest)
        entry: ./.venv/bin/pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: frontend-tests
        name: Frontend Tests (npm type-check & test)
        entry: bash -c "cd frontend && npm run type-check && npx vitest run --passWithNoTests"
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: Ruff Linter (ruff check src tests)
        entry: ./.venv/bin/ruff check src tests
        language: system
        pass_filenames: false
        always_run: true

      - id: lineagelens-dead-code
        name: LineageLens Dead Code Ratchet (lineagelens check . --fail-on dead)
        entry: ./.venv/bin/lineagelens check . --fail-on dead
        language: system
        pass_filenames: false
        always_run: true
