name: Version Bump

# Runs when a PR is merged into main (closed + merged = true)
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  bump:
    # Only run when the PR was actually merged (not just closed/abandoned)
    # and carries at least one release label.
    if: |
      github.event.pull_request.merged == true &&
      (
        contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')
      )

    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the version commit and tag

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Use a PAT or the default GITHUB_TOKEN.
          # GITHUB_TOKEN can push commits but won't re-trigger other workflows.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # full history so 'git log' / 'git tag' work

      - name: Determine bump type
        id: bump_type
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q 'release:major'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q 'release:minor'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Read current version from pyproject.toml
        id: current
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Calculate new version
        id: new_version
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.current.outputs.version }}"
          BUMP="${{ steps.bump_type.outputs.type }}"
          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION ($BUMP bump)"

      - name: Update pyproject.toml
        run: |
          OLD='${{ steps.current.outputs.version }}'
          NEW='${{ steps.new_version.outputs.version }}'
          # Only replace the first occurrence (the [project] version field)
          sed -i "0,/version = \"$OLD\"/s/version = \"$OLD\"/version = \"$NEW\"/" pyproject.toml
          echo "--- pyproject.toml version line ---"
          grep -m1 '^version' pyproject.toml

      - name: Commit and tag
        run: |
          NEW='${{ steps.new_version.outputs.version }}'
          PR='${{ github.event.pull_request.number }}'
          BUMP='${{ steps.bump_type.outputs.type }}'

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml
          git commit -m "chore: bump version to $NEW ($BUMP) [PR #$PR]"
          git tag "v$NEW" -m "Release v$NEW"
          git push origin main --follow-tags
