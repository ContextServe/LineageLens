name: lineagelens

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Editable, deliberately. A non-editable install shadows src/ and the test
      # suite then reports on the wheel rather than on the code under review.
      # tests/conftest.py fails loudly if that happens anyway.
      # `rest` is here so tests/test_rest.py runs rather than skipping. It was
      # the absence of any importer that let rest.py stay broken for months.
      - name: Install
        run: pip install -e ".[dev,mcp,rest]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Indexes every language present in one graph. No init step and no config
      # file: language is detected per file and services come from build
      # manifests.
      - name: Index
        run: lineagelens index .

      # The invariant that matters most (§16.1). Foreign keys make a dangling
      # endpoint impossible, and `index` asserts the count is zero before
      # returning -- but this is the defect that made the schema-3 Dubbo graph
      # 100% non-traversable while reporting success, so CI checks it too.
      - name: Coverage report
        run: lineagelens coverage .

      # Same commit must produce the same graph. Catches order dependence and
      # any wall-clock or RNG value leaking into a stored row, which is the
      # class of bug that hides best (§11).
      - name: Determinism
        run: lineagelens verify .

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # The capability matrix served by `get_ontology` is a generated artifact.
      # If the code has moved on and the matrix has not, agents read a stale
      # contract -- which is the schema-3 ontology failure with a JSON file
      # instead of a dict. Regenerating must produce no diff.
      - name: Capability matrix is current
        run: |
          python -m lineagelens.conformance.runner
          git diff --exit-code src/lineagelens/conformance/matrix.json

  # A compile is the cheapest version of the test that would have caught the
  # API drift in #55: the dashboard had no build configuration at all, so
  # nothing checked that it still matched the routes it calls (#64).
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci`, not `install`: the lockfile is the pinned set, and a resolver
      # free to drift would make a rendering change indistinguishable from a
      # graph change.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
