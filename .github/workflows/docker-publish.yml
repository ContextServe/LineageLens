name: Publish Docker images to GHCR

on:
  push:
    branches: [main]
  release:
    types: [published]   # fires even when another workflow creates the release
  pull_request:          # build-only, no push — validates the Dockerfile
  workflow_dispatch:     # manual trigger / backfill from the GitHub Actions UI
    inputs:
      version:
        description: 'Version to tag (e.g. 3.0.0 — without the v prefix)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE:    ghcr.io/${{ github.repository_owner }}/lineagelens

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Required so the GITHUB_TOKEN can write packages
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        target: [node, java, go, rust, clang, ruby, monolith]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Auth ──────────────────────────────────────────────────────────────
      # Skip on pull_request — forks don't have write access to packages
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Resolve version ───────────────────────────────────────────────────
      # Priority: release event tag > git tag push > workflow_dispatch input > empty
      # NOTE: push: tags does NOT fire when another workflow creates the tag via
      #       GITHUB_TOKEN (GitHub blocks cascading triggers). release: published
      #       DOES fire in that case, making it the correct trigger for auto-releases.
      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            # Strip the leading "v" from the release tag (e.g. v3.0.1 -> 3.0.1)
            echo "value=${{ github.event.release.tag_name }}" | sed 's/v//' >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=" >> $GITHUB_OUTPUT
          fi


      # ── Metadata (tags + labels) ──────────────────────────────────────────
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Trigger        Tags produced
          # tag push       3.0.0-node, 3.0-node, node, latest (monolith only)
          # workflow_dispatch  3.0.0-node, node, latest (monolith only)
          # main push      main-node
          # pull_request   pr-42-node (build only, not pushed)
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.target }}
            type=ref,event=pr,suffix=-${{ matrix.target }}
            type=semver,pattern={{version}},suffix=-${{ matrix.target }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.target }}
            type=raw,value=${{ matrix.target }},enable=${{ steps.ver.outputs.value != '' }}
            type=raw,value=${{ steps.ver.outputs.value }}-${{ matrix.target }},enable=${{ steps.ver.outputs.value != '' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.value != '' && matrix.target == 'monolith' }}

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push - ${{ matrix.target }}
        uses: docker/build-push-action@v5
        with:
          context: .
          target:  ${{ matrix.target }}
          push:    ${{ github.event_name != 'pull_request' }}
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          # On PRs: no registry push — explicitly write to cache only to suppress
          # the "No output specified" warning from the docker-container driver.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || '' }}
          # Layer cache: reuse previous builds to speed up CI
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to:   type=gha,scope=${{ matrix.target }},mode=max
