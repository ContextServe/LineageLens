name: Publish Docker images to GHCR

on:
  push:
    branches: [main]     # rolling main-* tags
  pull_request:          # build-only, no push — validates the Dockerfile
  workflow_run:
    workflows: ["Version Bump"]   # fires after version-bump creates the git tag
    types: [completed]            # works even though version-bump uses GITHUB_TOKEN
    # NOTE: no 'branches' filter here — for pull_request-triggered workflows,
    # GitHub evaluates the filter against the PR HEAD branch (e.g. feature/*),
    # not the base branch (main). Omitting it lets the trigger fire correctly.
    # version-bump.yml already guards itself with its own branches: [main] filter.
  workflow_dispatch:     # manual trigger / backfill from the GitHub Actions UI
    inputs:
      version:
        description: 'Version to tag (e.g. 3.0.0 — without the v prefix)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE:    ghcr.io/${{ github.repository_owner }}/lineagelens

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Required so the GITHUB_TOKEN can write packages
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        target: [node, java, go, rust, clang, ruby, monolith]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Auth ──────────────────────────────────────────────────────────────
      # Skip on pull_request — forks don't have write access to packages
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Resolve version ───────────────────────────────────────────────────
      # Priority: workflow_run (Version Bump just pushed a tag) > workflow_dispatch > empty
      # NOTE: version-bump.yml uses GITHUB_TOKEN, so push:tags and release:published
      #       are both blocked from cascading (GitHub cascade prevention). workflow_run
      #       is the correct trigger — it fires after version-bump completes regardless
      #       of which token was used, and by then the tag is already in the remote.
      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # Only proceed if version-bump succeeded
            if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
              echo "value=" >> $GITHUB_OUTPUT
              echo "Version Bump workflow did not succeed — skipping versioned tags"
              exit 0
            fi
            # Fetch tags pushed by version-bump (they exist in remote by now)
            git fetch --tags --quiet
            LATEST_TAG=$(git tag --sort=-version:refname | grep '^v' | head -1)
            echo "value=${LATEST_TAG#v}" >> $GITHUB_OUTPUT
            echo "Resolved version from latest tag: ${LATEST_TAG}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=" >> $GITHUB_OUTPUT
          fi


      # ── Metadata (tags + labels) ──────────────────────────────────────────
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Trigger        Tags produced
          # tag push       3.0.0-node, 3.0-node, node, latest (monolith only)
          # workflow_dispatch  3.0.0-node, node, latest (monolith only)
          # main push      main-node
          # pull_request   pr-42-node (build only, not pushed)
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.target }}
            type=ref,event=pr,suffix=-${{ matrix.target }}
            type=semver,pattern={{version}},suffix=-${{ matrix.target }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.target }}
            type=raw,value=${{ matrix.target }},enable=${{ steps.ver.outputs.value != '' }}
            type=raw,value=${{ steps.ver.outputs.value }}-${{ matrix.target }},enable=${{ steps.ver.outputs.value != '' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.value != '' && matrix.target == 'monolith' }}

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push - ${{ matrix.target }}
        uses: docker/build-push-action@v5
        with:
          context: .
          target:  ${{ matrix.target }}
          push:    ${{ github.event_name != 'pull_request' }}
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          # On PRs: no registry push — explicitly write to cache only to suppress
          # the "No output specified" warning from the docker-container driver.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || '' }}
          # Layer cache: reuse previous builds to speed up CI
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to:   ${{ github.event_name == 'push' && format('type=gha,scope={0},mode=max', matrix.target) || '' }}
