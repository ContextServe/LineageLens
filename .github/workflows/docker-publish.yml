name: Publish Docker images to GHCR

on:
  push:
    branches: [main]
    tags:    ["v*"]          # e.g. v1.2.3  -> ghcr.io/...:1.2.3
  pull_request:              # build-only, no push - validates the Dockerfile
  workflow_dispatch:         # manual trigger from the GitHub Actions UI
    inputs:
      version:
        description: 'Version to tag (e.g. 3.0.0 — without the v prefix)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE:    ghcr.io/${{ github.repository_owner }}/lineagelens

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Required so the GITHUB_TOKEN can write packages
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        target: [node, java, go, rust, clang, ruby, monolith]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Auth ──────────────────────────────────────────────────────────────
      # Skip on pull_request — forks don't have write access to packages
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Metadata (tags + labels) ──────────────────────────────────────────
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # On main        : ghcr.io/.../lineagelens:node
          # On v1.2.3 tag  : ghcr.io/.../lineagelens:node-1.2.3 + node-1.2 + node
          # Manual dispatch: ghcr.io/.../lineagelens:node-<version> + node-<major.minor>
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.target }}
            type=semver,pattern={{version}},suffix=-${{ matrix.target }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.target }}
            type=raw,value=${{ matrix.target }},enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=latest,enable=${{ matrix.target == 'monolith' && github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ inputs.version }}-${{ matrix.target }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && matrix.target == 'monolith' }}

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push - ${{ matrix.target }}
        uses: docker/build-push-action@v5
        with:
          context: .
          target:  ${{ matrix.target }}
          push:    ${{ github.event_name != 'pull_request' }}
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          # On PRs: no registry push — explicitly write to cache only to suppress
          # the "No output specified" warning from the docker-container driver.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || '' }}
          # Layer cache: reuse previous builds to speed up CI
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to:   type=gha,scope=${{ matrix.target }},mode=max
