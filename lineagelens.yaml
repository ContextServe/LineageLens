source_roots:
- src
test_roots:
- tests
script_roots:
- scripts
cron_files: []
docs_globs:
- '**/*.md'
frameworks:
- fastapi
- strawberry
analysis:
  risk_rules:
  - category: data_write
    severity: review
    match_words:
    - execute
    - insert
    - update
    - delete
    - write
    - save
    - commit
    only_in_async: false
  - category: blocking_in_async
    severity: high
    match_words:
    - requests.
    - time.sleep
    - subprocess.
    only_in_async: true
  entry_points:
    api_route:
    - .get
    - .post
    - .put
    - .patch
    - .delete
    - .websocket
    cli_command:
    - .command
    - .callback
    framework_callback:
    - .middleware
    - .exception_handler
    - .on_event
    - validator
    - field_validator
    - model_validator
    # This project registers its MCP tools with @server.tool() and its GraphQL
    # schema with strawberry decorators. Neither is called from Python, so without
    # these suffixes every tool and resolver reports as dead.
    - .tool
    - .resource
    - .prompt
    - strawberry.field
    - strawberry.type
output:
  directory: .lineagelens
  filename: graph.json
server:
  host: 127.0.0.1
  port: 8717
llm:
  provider: openai_compatible
  base_url: https://api.openai.com/v1
  model: gpt-4-turbo
  api_key_env: LINEAGELENS_API_KEY
