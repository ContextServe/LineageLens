source_roots: [src]
test_roots: [tests]
script_roots: [scripts]
cron_files: [ops/crontab]
docs_globs: ["**/*.md", "**/*.rst"]
frameworks: [fastapi, typer]
analysis:
  entry_points:
    api_route: [".get", ".post", ".put", ".patch", ".delete", ".websocket"]
    cli_command: [".command", ".callback"]
    framework_callback: [".middleware", ".exception_handler", ".on_event", "validator", "field_validator", "model_validator"]
  risk_rules:
    - category: data_write
      severity: review
      match_words: [execute, insert, update, delete, write, save, commit]
    - category: blocking_in_async
      severity: high
      only_in_async: true
      match_words: ["requests.", "time.sleep", "subprocess."]
output:
  directory: .lineagelens
  filename: graph.json
server:
  host: 127.0.0.1
  port: 8717
llm:
  provider: openai_compatible
  base_url: https://api.openai.com/v1
  model: gpt-5
  api_key_env: LINEAGELENS_API_KEY
